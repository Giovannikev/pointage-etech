name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: App (type check, lint, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  functions:
    name: Edge Functions (Deno check and tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # deno.json keeps npm: imports in Deno's own cache: without it Deno sees
      # the app's package.json and looks for them in node_modules.
      - name: Type-check every function
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts
      - name: Deno tests
        run: deno test --config supabase/functions/deno.json supabase/functions

  deploy-functions:
    name: Deploy the Edge Functions
    # Only after a push to main, once the checks passed: a fix merged on main
    # is then live without pasting anything in the Supabase dashboard.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, functions]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Skip without the Supabase secrets
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == ''
        run: echo "::warning::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets to deploy the functions automatically."
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
      # The CLI comes from npm: supabase/setup-cli looks up the latest release
      # through the GitHub API, whose anonymous rate limit fails the job.
      - uses: actions/setup-node@v4
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        with:
          node-version: 22
      - name: Deploy the functions called by the app (JWT verified)
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: >
          npx --yes supabase@2 functions deploy user-settings github-commits odoo-gateway
          --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
      - name: Deploy auto-attendance (called by pg_cron with CRON_SECRET, no JWT)
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: >
          npx --yes supabase@2 functions deploy auto-attendance
          --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes --no-verify-jwt
